name: Deploy to AWS

on:
  push:
    branches:
      - deploy/aws-eb

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    env:
      AWS_REGION: us-east-1
      ECR_REPO: myecrrepo
      IMAGE_TAG: ${{ github.sha }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: Build Docker image
        run: |
          docker build -t $ECR_REPO:${{ env.IMAGE_TAG }} .

      - name: Tag Docker image for ECR
        run: |
          docker tag $ECR_REPO:${{ env.IMAGE_TAG }} ${{ steps.login-ecr.outputs.registry }}/${ECR_REPO}:${{ env.IMAGE_TAG }}

      - name: Push Docker image to ECR
        run: |
          docker push ${{ steps.login-ecr.outputs.registry }}/${ECR_REPO}:${{ env.IMAGE_TAG }}

      - name: Prepare Dockerrun file
        run: |
          cp Dockerrun.aws.json Dockerrun-${{ env.IMAGE_TAG }}.json
          zip deploy-${{ env.IMAGE_TAG }}.zip Dockerrun-${{ env.IMAGE_TAG }}.json

      - name: Deploy to Elastic Beanstalk
        uses: einaregilsson/beanstalk-deploy@v22
        with:
          aws_access_key: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws_secret_key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          application_name: crag-rag-prod
          environment_name: crag-rag-prod
          region: ${{ env.AWS_REGION }}
          version_label: ${{ env.IMAGE_TAG }}
          deployment_package: deploy-${{ env.IMAGE_TAG }}.zip
          wait_for_deployment: true